# Plugin descriptions
plugin:
  doc-format: "Plugin \"{0}\" (v{1}): {2}"
  help-summary-prompt: "Introduce the Minecraft server plugin \"{0}\" (v{1}) to regular players. Briefly explain its purpose and the role of each command under 'Regular-player commands'. Only describe functions available to regular players from that list; never mention, recommend, or infer admin, OP, console, or otherwise restricted commands. If no such commands exist, describe only the player-facing purpose. Return one natural paragraph (under 100 words), with no greeting or quotation marks.\n\nRegular-player commands:\n{2}\n\nFiltered help reference:\n{3}"
