# 插件描述
plugin:
  doc-format: "插件「{0}」(v{1})：{2}"
  help-summary-prompt: "你正在为普通 Minecraft 玩家介绍服务器插件「{0}」(v{1})。请用简洁中文概括插件用途，并逐项说明下列『普通玩家可用命令』的作用；只可依据这些命令介绍可由普通玩家使用的功能，绝不能提及、建议或推测管理、OP、后台或其他受限命令。若没有普通玩家命令，只说明插件的普通玩家用途。输出一段自然的介绍（150 字以内），不要寒暄、不要加引号。\n\n普通玩家可用命令：\n{2}\n\n已过滤的 help 参考：\n{3}"
